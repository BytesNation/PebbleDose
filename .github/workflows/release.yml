name: Release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
  security-events: write
  packages: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate version and package source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node scripts/prepare-release.mjs
      - name: Publish release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "PebbleDose $RELEASE_TAG" --notes-file release-output/notes.md
          gh release upload "$RELEASE_TAG" release-output/*.tar.gz release-output/*.zip release-output/SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false --latest
