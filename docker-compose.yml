services:
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    command: ['node', 'dist/migrate.js']
    environment:
      DATABASE_PATH: /data/medicine.db
    volumes:
      - medicine-data:/data
    restart: 'no'
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_PATH: /data/medicine.db
      PORT: 3001
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      HOUSEHOLD_TIMEZONE: ${HOUSEHOLD_TIMEZONE:-America/New_York}
      KIOSK_RETURN_DELAY: ${KIOSK_RETURN_DELAY:-1800}
      PUSH_SUBJECT: ${PUSH_SUBJECT:-https://pebbledose.local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      - medicine-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:80'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/api/health']
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  medicine-data:
